name: Bug report
description: Report a reproducible merging or interface problem
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: 'Never attach private PDFs, passwords, extracted text or sensitive screenshots. Use the sample PDFs or a synthetic example. Report vulnerabilities through SECURITY.md.'
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected result
      description: Include document order, page edits and page ranges; describe what actually happened.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser, version and operating system
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Can you reproduce it with the bundled sample?
