name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run fixtures
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:coverage
      - run: npm run screenshots
      - name: Upload verified site
        uses: actions/upload-artifact@v7
        with:
          name: verified-site
          path: dist
          retention-days: 3
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Verify alternate base path
        env:
          VITE_BASE_PATH: /alternate/
        run: |
          npm run build
          npx playwright test --project=chromium --grep "three bundled samples"
